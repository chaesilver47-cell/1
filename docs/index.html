   exp.facts.filter(f => used.has(f.id) && !f.ok).forEach(f => {\n      warns.push({type:\"src\", hit:null, fid:f.id, msg:`원문에서 못 찾은 내용 '${f.quote}'`, help:\"AI가 근거로 댄 문구가 원문에 그대로 없어요. 사실인지 확인해주세요.\"});\n    });\n  }\n  const len = [...text].length;\n  return {warns, len, over: len > (exp.input.limit || 80)};\n}\nfunction bigrams(s){ const t = squash(s); const set = new Set(); for (let i = 0; i \u003c t.length - 1; i++) set.add(t.slice(i, i + 2)); return set; }\nfunction similarity(a, b){ const A = bigrams(a), B = bigrams(b); if (!A.size || !B.size) return 0; let n = 0; A.forEach(x => B.has(x) && n++); return n / (A.size + B.size - n); }\nfunction tooSimilar(exp){\n  const t = exp.order.map(j => cardText(exp.results[j])).filter(Boolean);\n  if (t.length \u003c 2) return false;\n  let sum = 0, c = 0;\n  for (let i = 0; i \u003c t.length; i++) for (let k = i + 1; k \u003c t.length; k++) { sum += similarity(t[i], t[k]); c++; }\n  return sum / c > 0.5;\n}\n\n/* ───────────── 4. 결과 정리 ───────────── */\nconst cardText = r => !r ? \"\" : (r.edited != null ? r.edited : (r.segments || []).map(s => s.text).join(\"\")).trim();\nfunction normalizeResult(raw, jobs){\n  const out = {};\n  (raw && Array.isArray(raw.results) ? raw.results : []).forEach(r => {\n    if (!r || !Array.isArray(r.segments)) return;\n    let job = String(r.job || \"\");\n    if (!jobs.includes(job)) job = jobs.find(j => squash(j) === squash(job) || job.includes(j) || j.includes(job)) || job;\n    if (!jobs.includes(job)) return;\n    out[job] = {\n      segments: r.segments.filter(s => s && s.text).map(s => ({text:String(s.text), facts:Array.isArray(s.facts) ? s.facts.map(String) : []})),\n      reason: String(r.reason || \"\"), tags: Array.isArray(r.tags) ? r.tags.slice(0, 3).map(String) : [],\n      keywords: Array.isArray(r.keywords) ? r.keywords.map(k => typeof k === \"string\" ? k : (k && (k.word || k.keyword)) || \"\").map(k => String(k).trim()).filter(Boolean).slice(0, 5) : [],\n      edited: null, copiedAt: null\n    };\n  });\n  return out;\n}\nfunction verifyFacts(facts, src){\n  const s = squash(src);\n  return (Array.isArray(facts) ? facts : []).filter(f => f && f.id && f.quote).map(f => ({id:String(f.id), quote:String(f.quote), ok: s.includes(squash(f.quote))}));\n}\n\n/* ───────────── 5. 생성 흐름 ───────────── */\nlet ctl = null;\nconst STEP_LABELS = [\"직무별로 뭘 볼지 생각하는 중\",\"원문을 사실 단위로 나누는 중\",\"직무별 문장 쓰는 중\",\"원문과 대조하는 중\"];\nfunction showLoading(step, extra){\n  document.getElementById(\"layer\").innerHTML = `\u003cdiv class=\"overlay\" role=\"dialog\" aria-live=\"polite\">\u003cdiv class=\"box\">\n    \u003ch3>직무별로 만드는 중…\u003c/h3>\n    \u003cul class=\"steps\">${STEP_LABELS.map((l, i) => `\u003cli class=\"${i \u003c step ? \"done\" : i === step ? \"now\" : \"\"}\">${l}${i === 2 && extra ? ` \u003cspan class=\"mono\">(${extra})\u003c/span>` : \"\"}\u003c/li>`).join(\"\")}\u003c/ul>\n    \u003cp style=\"font-size:13px;color:var(--sub);margin:0 0 14px\">처음 한 번은 claude.ai가 \"Claude 사용을 허용할까요?\"라고 물어봐요. 보통 10~40초 걸려요.\u003c/p>\n    \u003cbutton class=\"btn\" type=\"button\" id=\"stop\">그만두기\u003c/button>\u003c/div>\u003c/div>`;\n  document.getElementById(\"stop\").onclick = () => ctl && ctl.abort();\n}\nconst hideLayer = () => { document.getElementById(\"layer\").innerHTML = \"\"; };\n\nasync function generate(){\n  const d = state.draft;\n  const targets = selectedTargets();\n  const jobs = targets.map(t => t.label);\n  state.error = null;\n  ctl = new AbortController();\n  let step = 0; showLoading(0);\n  const onText = ({text}) => {\n    let s = 1, extra = \"\";\n    if (text.includes('\"results\"')) { s = 2; const n = (text.split('\"results\"')[1].match(/\"job\"/g) || []).length; extra = `${Math.max(1, n)}/${jobs.length}`; }\n    if (s !== step || s === 2) { step = s; showLoading(s, extra); }\n  };\n  try {\n    const raw = await askJSON(generatePrompt(d, targets), onText, ctl.signal);\n    showLoading(3);\n    const src = sourceText(d);\n    const facts = verifyFacts(raw && raw.facts, src);\n    const results = normalizeResult(raw, jobs);\n    const order = jobs.filter(j => results[j]);\n    if (!order.length) throw {code:\"invalid_json\"};\n    const now = Date.now();\n    const input = JSON.parse(JSON.stringify({mode:d.mode,name:d.name,role:d.role,period:d.period,did:d.did,result:d.result,tools:d.tools,problem:d.problem,raw:d.raw,limit:d.limit}));\n    const tmap = Object.fromEntries(targets.map(t => [t.label, t]));\n    let exp = d.editingId && state.archive.find(x => x.id === d.editingId);\n    if (exp) Object.assign(exp, {input, facts, results, order, targets:tmap, updatedAt:now});\n    else { exp = {id:\"e\" + now, createdAt:now, updatedAt:now, input, facts, results, order, targets:tmap}; state.archive.unshift(exp); }\n    state.archive = state.archive.slice(0, 40);\n    saveArchive();\n    state.draft.editingId = exp.id; state.draft.isExample = false; saveDraft();\n    await new Promise(r => setTimeout(r, 350));\n    openExperience(exp.id);\n  } catch (e) {\n    if (!(e && e.code === \"cancelled\")) state.error = errMsg(e);\n    render();\n  } finally { hideLayer(); ctl = null; }\n}\n\nasync function regenerate(jobs, avoidMap){\n  const exp = current(); if (!exp) return;\n  jobs.forEach(j => state.editing[j] = false);\n  const busy = new Set(jobs);\n  render(busy);\n  const avoid = jobs.flatMap(j => (avoidMap && avoidMap[j]) || []);\n  try {\n    const raw = await askJSON(regenPrompt(exp, jobs, avoid), null, new AbortController().signal);\n    const res = normalizeResult(raw, jobs);\n    let got = 0;\n    jobs.forEach(j => { if (res[j]) { exp.results[j] = res[j]; got++; if (!exp.order.includes(j)) exp.order.push(j); } });\n    if (!got) throw {code:\"invalid_json\"};\n    exp.updatedAt = Date.now(); saveArchive();\n    toast(jobs.length === 1 ? `${jobs[0]} 문장을 새로 만들었어요` : \"새 직무 문장을 만들었어요\");\n  } catch (e) {\n    if (!(e && e.code === \"cancelled\")) toast(errMsg(e));\n  }\n  render();\n}\n\n/* ───────────── 6. 화면 그리기 ───────────── */\nconst esc = s => String(s == null ? \"\" : s).replace(/[&\u003c>\"']/g, c => ({\"&\":\"&amp;\",\"\u003c\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"}[c]));\nconst app = document.getElementById(\"app\");\nconst postingLabel = p => ((p.company || \"\").trim() ? p.company.trim() + \" · \" : \"\") + (p.title || \"\").trim();\nfunction selectedTargets(){\n  const d = state.draft, list = [];\n  d.jobs.forEach(j => list.push({label:j, kind:\"job\"}));\n  const c = (d.custom || \"\").trim();\n  if (c && !list.some(t => t.label === c)) list.push({label:c, kind:\"job\"});\n  (d.postings || []).forEach(p => {\n    let l = postingLabel(p); while (list.some(t => t.label === l)) l += \" ②\";\n    list.push({label:l, kind:\"posting\", company:(p.company || \"\").trim(), title:(p.title || \"\").trim(), jd:p.jd || \"\"});\n  });\n  return list.slice(0, 4);\n}\nconst selectedJobs = () => selectedTargets().map(t => t.label);\nfunction keywordHits(r){\n  const sq = squash(cardText(r));\n  return (r.keywords || []).map(k => {\n    const words = k.replace(/\\s*(역량|능력|경험|스킬)$/, \"\").split(/\\s+/).map(w => squash(w).replace(/(을|를|이|가|의|및|과|와)$/, \"\")).filter(w => w.length >= 2);\n    return {k, used: words.length > 0 && words.every(w => sq.includes(w))};\n  });\n}\nfunction keywordHTML(r){\n  const hits = keywordHits(r);\n  if (!hits.length) return \"\";\n  const n = hits.filter(h => h.used).length;\n  return `\u003cspan class=\"kw-l\">공고 키워드 ${n}/${hits.length}\u003c/span>${hits.map(h => `\u003cspan class=\"kwi ${h.used ? \"on\" : \"\"}\" title=\"${h.used ? \"문장에 반영됨\" : \"문장에 안 들어감 (경험 근거가 약하거나 우선순위에서 밀림)\"}\">${h.used ? \"✓ \" : \"\"}${esc(h.k)}\u003c/span>`).join(\"\")}`;\n}\nfunction postingFormHTML(f, prefix){\n  return `\u003cdiv class=\"pform\">\n    \u003cdiv class=\"grid2\">\n      \u003cdiv class=\"field\">\u003clabel for=\"${prefix}-company\">회사명 \u003csmall>· 선택\u003c/small>\u003c/label>\u003cinput id=\"${prefix}-company\" data-pf=\"company\" placeholder=\"예) A사\" value=\"${esc(f.company)}\">\u003c/div>\n      \u003cdiv class=\"field\">\u003clabel for=\"${prefix}-title\">직무명 \u003cem>*\u003c/em>\u003c/label>\u003cinput id=\"${prefix}-title\" data-pf=\"title\" placeholder=\"예) 콘텐츠 마케팅\" value=\"${esc(f.title)}\">\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"field\">\u003clabel for=\"${prefix}-jd\">공고 내용 \u003cem>*\u003c/em> \u003csmall>· 주요 업무·자격요건·우대사항을 그대로 붙여넣어요\u003c/small>\u003c/label>\u003ctextarea id=\"${prefix}-jd\" data-pf=\"jd\" rows=\"6\" placeholder=\"[주요 업무]&#10;- 브랜드 SNS 채널 운영 및 콘텐츠 기획&#10;[자격 요건]&#10;- 데이터 기반으로 성과를 분석할 수 있는 분\">${esc(f.jd)}\u003c/textarea>\u003c/div>\n    \u003cdiv class=\"row-end\">\u003cbutton class=\"btn sm quiet\" type=\"button\" data-act=\"${prefix}-cancel\">취소\u003c/button>\u003cbutton class=\"btn sm primary\" type=\"button\" data-act=\"${prefix}-save\">${f.id ? \"수정 완료\" : \"공고 추가\"}\u003c/button>\u003c/div>\n  \u003c/div>`;\n}\n\nfunction sufficiency(d){\n  const body = d.mode === \"raw\" ? d.raw : [d.did, d.result, d.problem].join(\"\\n\");\n  const facts = body.split(/\\n|,|·(?=\\s)|\\.(?=\\s|$)|;/).map(s => s.trim()).filter(s => s.length >= 3).length;\n  const nums = numbers(body).length;\n  const level = facts >= 5 && nums >= 1 ? 3 : facts >= 3 ? 2 : 1;\n  const msg = level === 3 ? `사실 ${facts}개 · 숫자 ${nums}개 · 직무별로 다르게 쓰기 충분해요`\n    : level === 2 ? `사실 ${facts}개${nums ? \"\" : \" · 숫자 없음\"} · 성과나 숫자를 하나 더 넣으면 직무별 차이가 커져요`\n    : `사실 ${facts}개 · 이대로면 직무별 문장이 비슷하게 나올 수 있어요`;\n  return {level, msg, facts};\n}\nfunction canGenerate(){\n  const d = state.draft;\n  const filled = d.mode === \"raw\" ? (d.raw.trim().length >= 10 && d.name.trim()) : (d.name.trim() && d.role.trim() && d.did.trim());\n  const n = selectedJobs().length;\n  return {ok: !!filled && n >= 2, why: !filled ? (d.mode === \"raw\" ? \"활동명과 내용을 채워주세요\" : \"활동명, 내 역할, 한 일을 채워주세요\") : n \u003c 2 ? \"직무나 채용공고를 2개 이상 골라주세요\" : `지원 대상 ${n}개로 만들어요`};\n}\n\nfunction renderInput(){\n  const d = state.draft;\n  const fieldHTML = f => `\u003cdiv class=\"field ${f.k === \"name\" ? \"f-name\" : \"\"}\">\n      \u003clabel for=\"in-${f.k}\">${f.label}${f.req ? \" \u003cem>*\u003c/em>\" : \"\"}${f.hint ? ` \u003csmall>· ${f.hint}\u003c/small>` : \"\"}\u003c/label>\n      ${f.multi ? `\u003ctextarea id=\"in-${f.k}\" data-k=\"${f.k}\" rows=\"${f.k === \"did\" ? 5 : 3}\" placeholder=\"${esc(f.ph)}\">${esc(d[f.k])}\u003c/textarea>`\n                : `\u003cinput id=\"in-${f.k}\" data-k=\"${f.k}\" placeholder=\"${esc(f.ph)}\" value=\"${esc(d[f.k])}\">`}\u003c/div>`;\n  const F = k => FIELDS.find(f => f.k === k);\n  const suf = sufficiency(d);\n  const cg = canGenerate();\n  const jobs = selectedJobs();\n  const noAI = sampleFn === null;\n  const aiNote = noAI && !IN_CLAUDE\n    ? `\u003cdiv class=\"notice info\">\u003cspan>\u003cb>미리보기 주소예요.\u003c/b> 여기서는 AI가 돌지 않아서 예시 경험으로 미리 만들어둔 결과를 보여드려요. 내 경험으로 만들려면 claude.ai 버전을 열고 \u003cb>복제\u003c/b>해서 내 계정으로 가져가세요.\u003c/span>\u003cspan class=\"acts-inline\">\u003ca class=\"btn sm primary\" href=\"${ARTIFACT_URL}\" target=\"_blank\" rel=\"noopener\">claude.ai에서 열기\u003c/a>\u003cbutton class=\"btn sm\" type=\"button\" data-act=\"demo\">예시 결과 보기\u003c/button>\u003c/span>\u003c/div>`\n    : \"\";\n  app.innerHTML = `\u003cdiv class=\"narrow stack\">\n    ${aiNote}\n    ${d.isExample && !noAI ? `\u003cdiv class=\"notice info\">\u003cspan>예시 경험이 채워져 있어요. 그대로 만들어 보거나 비우고 내 경험을 넣어보세요.\u003c/span>\u003cbutton class=\"btn sm\" type=\"button\" data-act=\"clear\">비우고 시작\u003c/button>\u003c/div>` : \"\"}\n    ${state.error ? `\u003cdiv class=\"notice warn\" role=\"alert\">\u003cspan>${esc(state.error)} 입력한 내용은 그대로 있어요.\u003c/span>\u003cbutton class=\"btn sm\" type=\"button\" data-act=\"generate\">다시 시도\u003c/button>\u003c/div>` : \"\"}\n    \u003csection class=\"panel\">\n      \u003cdiv class=\"sec-h\">\u003ch2>1. 경험 넣기\u003c/h2>\n        \u003cdiv class=\"seg-toggle\" role=\"tablist\">\u003cbutton type=\"button\" data-mode=\"fields\" class=\"${d.mode === \"fields\" ? \"on\" : \"\"}\">항목별로 쓰기\u003c/button>\u003cbutton type=\"button\" data-mode=\"raw\" class=\"${d.mode === \"raw\" ? \"on\" : \"\"}\">통째로 붙여넣기\u003c/button>\u003c/div>\u003c/div>\n      \u003cdiv class=\"stack\" style=\"gap:12px\">\n        \u003cdiv class=\"grid3\">${fieldHTML(F(\"name\"))}${fieldHTML(F(\"role\"))}${fieldHTML(F(\"period\"))}\u003c/div>\n        ${d.mode === \"fields\" ? `${fieldHTML(F(\"did\"))}${fieldHTML(F(\"result\"))}\n          \u003cdetails class=\"more\" ${d.tools || d.problem ? \"open\" : \"\"}>\u003csummary>사용 툴 · 문제 해결 과정 (선택)\u003c/summary>\u003cdiv>${fieldHTML(F(\"tools\"))}${fieldHTML(F(\"problem\"))}\u003c/div>\u003c/details>`\n        : `\u003cdiv class=\"field\">\u003clabel for=\"in-raw\">내용 \u003cem>*\u003c/em> \u003csmall>· 노션·메모에 써둔 걸 그대로 붙여넣어도 돼요\u003c/small>\u003c/label>\u003ctextarea id=\"in-raw\" data-k=\"raw\" rows=\"8\" placeholder=\"한 일, 성과, 사용한 툴, 문제를 해결한 과정까지 생각나는 대로\">${esc(d.raw)}\u003c/textarea>\u003c/div>`}\n        \u003cdiv class=\"gauge-row\">\u003cspan>재료\u003c/span>\u003cdiv class=\"gauge l${suf.level}\" aria-hidden=\"true\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/div>\u003cspan id=\"suf-msg\">${esc(suf.msg)}\u003c/span>\u003c/div>\n        \u003cdiv class=\"privacy\">회사·거래처 이름은 'A사'처럼 바꿔 써도 돼요. 입력한 내용은 서버에 저장하지 않아요.\u003c/div>\n      \u003c/div>\n    \u003c/section>\n    \u003csection class=\"panel\">\n      \u003cdiv class=\"sec-h\">\u003ch2>2. 어디에 지원해요?\u003csmall>직무나 채용공고 2~4개\u003c/small>\u003c/h2>\u003c/div>\n      \u003cdiv class=\"chips\">${Object.keys(JOBS).map(j => `\u003cbutton type=\"button\" class=\"chip ${d.jobs.includes(j) ? \"on\" : \"\"}\" data-job=\"${esc(j)}\" aria-pressed=\"${d.jobs.includes(j)}\">\u003cb>${esc(j)}\u003c/b>\u003csmall>${esc(JOBS[j].desc)}\u003c/small>\u003c/button>`).join(\"\")}\n        ${state.pform ? \"\" : `\u003cbutton type=\"button\" class=\"chip add\" data-act=\"pf-new\" ${jobs.length >= 4 ? \"disabled\" : \"\"}>\u003cb>＋ 채용공고 붙여넣기\u003c/b>\u003csmall>공고에 맞춘 문장을 따로 만들어요\u003c/small>\u003c/button>`}\u003c/div>\n      ${(d.postings || []).length ? `\u003cdiv class=\"posts\">${d.postings.map(p => `\u003cdiv class=\"post\">\u003cspan class=\"post-badge\">공고\u003c/span>\u003cdiv class=\"post-t\">\u003cb>${esc(postingLabel(p))}\u003c/b>\u003csmall>공고 ${[...(p.jd || \"\")].length.toLocaleString()}자\u003c/small>\u003c/div>\u003cbutton class=\"btn sm quiet\" type=\"button\" data-pedit=\"${esc(p.id)}\">수정\u003c/button>\u003cbutton class=\"btn sm quiet\" type=\"button\" data-pdel=\"${esc(p.id)}\" aria-label=\"공고 빼기\">✕\u003c/button>\u003c/div>`).join(\"\")}\u003c/div>` : \"\"}\n      ${state.pform ? postingFormHTML(state.pform, \"pf\") : \"\"}\n      \u003cdiv class=\"custom-row\">\u003cinput id=\"in-custom\" data-k=\"custom\" placeholder=\"다른 직무 직접 입력 (예: 상품기획 MD)\" value=\"${esc(d.custom)}\">\u003c/div>\n      \u003cdetails class=\"more\" style=\"margin-top:12px\">\u003csummary>글자 수 제한 (선택)\u003c/summary>\u003cdiv>\n        \u003cdiv class=\"field\" style=\"max-width:220px\">\u003clabel for=\"in-limit\">글자 수 제한 (공백 포함)\u003c/label>\u003cinput id=\"in-limit\" type=\"number\" min=\"30\" max=\"300\" step=\"5\" data-k=\"limit\" value=\"${esc(d.limit)}\">\u003c/div>\n      \u003c/div>\u003c/details>\n    \u003c/section>\n    \u003cdiv class=\"cta-row\">${noAI\n      ? `\u003cspan class=\"hint\">${IN_CLAUDE ? \"복제한 내 사본에서는 이 자리에 '직무별로 만들기' 버튼이 생겨요\" : \"AI는 claude.ai 버전에서만 동작해요\"}\u003c/span>\u003cspan class=\"acts-inline\">\u003cbutton class=\"btn lg${IN_CLAUDE ? \" primary\" : \"\"}\" type=\"button\" data-act=\"demo\">예시 결과 보기\u003c/button>${IN_CLAUDE ? \"\" : `\u003ca class=\"btn primary lg\" href=\"${ARTIFACT_URL}\" target=\"_blank\" rel=\"noopener\">claude.ai에서 열기 →\u003c/a>`}\u003c/span>`\n      : `\u003cspan class=\"hint\" id=\"cta-hint\">${esc(cg.why)}\u003c/span>\u003cbutton class=\"btn primary lg\" type=\"button\" id=\"go\" ${cg.ok ? \"\" : \"disabled\"}>직무별로 만들기 →\u003c/button>`}\u003c/div>\n  \u003c/div>`;\n}\n\nfunction renderSentence(r, warns){\n  const hits = warns.map(w => w.hit).filter(Boolean);\n  const mark = t => { let h = esc(t); hits.forEach(x => { const ex = esc(x); h = h.split(ex).join(`\u003cspan class=\"bad\">${ex}\u003c/span>`); }); return h; };\n  if (r.edited != null) return mark(r.edited);\n  return (r.segments || []).map(s => `\u003cspan class=\"sg\" data-f=\"${esc((s.facts || []).join(\" \"))}\">${mark(s.text)}\u003c/span>`).join(\"\");\n}\n\nfunction renderResult(busy){\n  const exp = current();\n  if (!exp) { state.view = \"input\"; return renderInput(); }\n  const isDemo = exp.id === \"demo\";\n  const remaining = Object.keys(JOBS).filter(j => !exp.order.includes(j));\n  const cards = exp.order.map((j, idx) => {\n    const r = exp.results[j];\n    const c = checkCard(exp, r);\n    const facts = [...new Set((r.segments || []).flatMap(s => s.facts || []))];\n    const editing = state.editing[j];\n    return `\u003carticle class=\"card ${c.warns.length ? \"has-warn\" : \"\"} ${busy && busy.has(j) ? \"busy\" : \"\"} ${idx === state.mTab ? \"m-on\" : \"\"}\" data-job=\"${esc(j)}\" data-facts=\"${esc(r.edited != null ? \"\" : facts.join(\" \"))}\">\n      \u003cdiv class=\"card-h\">\u003ch4>${targetOf(exp, j).kind === \"posting\" ? `\u003cspan class=\"post-badge\">공고 맞춤\u003c/span> ` : \"\"}${esc(j)}\u003c/h4>\u003cspan class=\"len ${c.over ? \"over\" : \"\"}\">${c.len}자 / ${exp.input.limit || 80}자\u003c/span>\u003c/div>\n      ${editing ? `\u003ctextarea class=\"editor\" data-edit=\"${esc(j)}\" aria-label=\"${esc(j)} 문장 고치기\">${esc(cardText(r))}\u003c/textarea>`\n                : `\u003cp class=\"sentence\" data-act=\"edit\" title=\"눌러서 고치기\">${renderSentence(r, c.warns)}\u003c/p>`}\n      ${r.tags && r.tags.length && r.edited == null ? `\u003cdiv class=\"tags\">${r.tags.map(t => `\u003cspan class=\"tag\">${esc(t)}\u003c/span>`).join(\"\")}\u003c/div>` : \"\"}\n      ${(r.keywords || []).length ? `\u003cdiv class=\"kw\">${keywordHTML(r)}\u003c/div>` : \"\"}\n      ${r.reason ? `\u003cdiv class=\"why\">\u003cb>왜 이렇게?\u003c/b> ${esc(r.reason)}\u003c/div>` : \"\"}\n      ${editing ? `\u003cdiv class=\"live-check\">${c.warns.length ? `\u003cp class=\"check bad-c\">⚠ ${c.warns.map(w => esc(w.msg)).join(\" · \")}\u003c/p>` : `\u003cp class=\"check ok\">✓ 숫자·역할 표현이 원문과 일치해요\u003c/p>`}\u003c/div>`\n      : c.warns.length ? `\u003cdiv class=\"warns\" role=\"status\">\u003cp class=\"check bad-c\">⚠ 확인이 필요한 곳 ${c.warns.length}개\u003c/p>${c.warns.map(w => `\u003cp>\u003cb>${esc(w.msg)}\u003c/b>\u003cbr>${esc(w.help)}\u003c/p>`).join(\"\")}\n          \u003cdiv class=\"acts\">\u003cbutton class=\"btn sm\" type=\"button\" data-act=\"edit\">직접 고치기\u003c/button>${isDemo ? \"\" : `\u003cbutton class=\"btn sm\" type=\"button\" data-act=\"regen-fix\">문제 빼고 다시 만들기\u003c/button>`}\u003c/div>\u003c/div>`\n        : `\u003cp class=\"check ok\">✓ 숫자·역할 표현이 원문과 일치해요\u003c/p>`}\n      \u003cdiv class=\"card-f\">\n        ${r.copiedAt ? `\u003cspan class=\"copied\">✓ 복사함 ${new Date(r.copiedAt).toLocaleTimeString(\"ko-KR\", {hour:\"2-digit\", minute:\"2-digit\"})}\u003c/span>` : `\u003cspan>\u003c/span>`}\n        \u003cdiv class=\"acts\">\n          ${editing ? `\u003cbutton class=\"btn sm\" type=\"button\" data-act=\"done\">다 고쳤어요\u003c/button>` : \"\"}\n          ${r.edited != null || editing ? `\u003cbutton class=\"btn sm quiet\" type=\"button\" data-act=\"revert\">원래대로\u003c/button>` : \"\"}\n          ${isDemo ? \"\" : `\u003cbutton class=\"btn sm quiet\" type=\"button\" data-act=\"regen\">다시 만들기\u003c/button>`}\n          \u003cbutton class=\"btn sm primary\" type=\"button\" data-act=\"copy\">복사\u003c/button>\n        \u003c/div>\n      \u003c/div>\u003c/article>`;\n  }).join(\"\");\n  const addCard = !isDemo && exp.order.length \u003c 4 ? `\u003cdiv class=\"addcard ${state.rpform ? \"open\" : \"\"}\">${state.rpform ? postingFormHTML(state.rpform, \"rpf\") : state.addOpen\n      ? `\u003cspan style=\"font-size:14px\">어떤 직무나 공고를 더 볼까요?\u003c/span>\u003cbutton class=\"btn sm\" type=\"button\" data-act=\"rpf-new\">＋ 채용공고 붙여넣기\u003c/button>\u003cdiv class=\"chips\">${remaining.map(j => `\u003cbutton class=\"chip\" type=\"button\" data-add=\"${esc(j)}\">\u003cb>${esc(j)}\u003c/b>\u003c/button>`).join(\"\")}\u003c/div>\n         \u003cdiv class=\"custom-row\" style=\"width:100%;max-width:320px\">\u003cinput id=\"add-custom\" placeholder=\"다른 직무 직접 입력\">\u003cbutton class=\"btn sm\" type=\"button\" data-act=\"add-custom\">추가\u003c/button>\u003c/div>\n         \u003cbutton class=\"btn sm quiet\" type=\"button\" data-act=\"add-close\">닫기\u003c/button>`\n      : `\u003cbutton class=\"btn\" type=\"button\" data-act=\"add-open\">＋ 직무·공고 추가\u003c/button>`}\u003c/div>` : \"\";\n  app.innerHTML = `\n    \u003cdiv class=\"rbar\">\u003cdiv class=\"left\">\u003cbutton class=\"btn quiet sm\" type=\"button\" data-act=\"back\">← 입력 수정\u003c/button>\u003ch1>${esc(exp.input.name || \"이름 없는 경험\")}\u003c/h1>${isDemo ? `\u003cspan class=\"demo-badge\">예시 결과 · 미리 만들어둔 것\u003c/span>` : \"\"}${isDemo && sampleFn === null && !IN_CLAUDE ? `\u003ca class=\"btn sm primary\" href=\"${ARTIFACT_URL}\" target=\"_blank\" rel=\"noopener\">claude.ai에서 열기\u003c/a>` : \"\"}\u003c/div>\n      \u003cdiv class=\"right\">\u003cbutton class=\"btn sm\" type=\"button\" data-act=\"new\">새 경험\u003c/button>\u003c/div>\u003c/div>\n    ${tooSimilar(exp) ? `\u003cdiv class=\"notice warn banner\">\u003cspan>직무별 문장이 서로 비슷해요. 한 일이나 성과를 1~2개 더 넣으면 차이가 커져요.\u003c/span>\u003cbutton class=\"btn sm\" type=\"button\" data-act=\"back\">입력 보강하기\u003c/button>\u003c/div>` : \"\"}\n    \u003cdiv class=\"work\">\n      \u003caside class=\"src\" id=\"src\">\u003ch3>원문\u003c/h3>\u003cp class=\"sub\">카드에 마우스를 올리면 근거가 형광펜으로 켜져요\u003c/p>\n        ${exp.facts.map(f => `\u003cdiv class=\"fact ${f.ok ? \"\" : \"unv\"}\" data-fid=\"${esc(f.id)}\">\u003cspan class=\"fid\">${esc(f.id)}\u003c/span>\u003cspan>${esc(f.quote)}\u003c/span>\u003c/div>`).join(\"\")}\n        ${exp.facts.some(f => !f.ok) ? `\u003cp class=\"sub\" style=\"margin:8px 0 0;color:var(--warn)\">? 표시는 원문에서 그대로 찾지 못한 문구예요\u003c/p>` : \"\"}\n        \u003cdetails>\u003csummary>입력한 원문 전체 보기\u003c/summary>\u003cpre>${esc(sourceText(exp.input))}\u003c/pre>\u003c/details>\n      \u003c/aside>\n      \u003csection>\n        \u003cdiv class=\"mtabs\" role=\"tablist\">${exp.order.map((j, i) => { const w = checkCard(exp, exp.results[j]).warns.length; return `\u003cbutton type=\"button\" data-mtab=\"${i}\" class=\"${i === state.mTab ? \"on\" : \"\"}\">${esc(j)}${w ? \" ⚠\" : \"\"}\u003c/button>`; }).join(\"\")}\u003c/div>\n        \u003cdiv class=\"cards ${exp.order.length === 1 && !addCard ? \"one\" : \"\"}\">${cards}${addCard}\u003c/div>\n      \u003c/section>\n    \u003c/div>`;\n  bindHighlight();\n  const ed = app.querySelector(\".editor\");\n  if (ed) { ed.focus(); ed.setSelectionRange(ed.value.length, ed.value.length); }\n}\n\nfunction render(busy){\n  if (state.view === \"result\") renderResult(busy); else renderInput();\n  renderDrawer();\n}\n\n/* ───────────── 7. 근거 하이라이트 ───────────── */\nfunction bindHighlight(){\n  const facts = [...app.querySelectorAll(\".fact\")];\n  const lit = (ids, strong) => facts.forEach(f => {\n    f.classList.toggle(\"lit\", ids.includes(f.dataset.fid));\n    f.classList.toggle(\"strong\", strong.includes(f.dataset.fid));\n  });\n  app.querySelectorAll(\".card\").forEach(c => {\n    const ids = (c.dataset.facts || \"\").split(\" \").filter(Boolean);\n    c.addEventListener(\"mouseenter\", () => lit(ids, []));\n    c.addEventListener(\"mouseleave\", () => lit([], []));\n    c.addEventListener(\"focusin\", () => lit(ids, []));\n    c.querySelectorAll(\".sg\").forEach(s => {\n      const own = (s.dataset.f || \"\").split(\" \").filter(Boolean);\n      s.addEventListener(\"mouseenter\", () => lit(ids, own));\n      s.addEventListener(\"mouseleave\", () => lit(ids, []));\n    });\n  });\n}\n\n/* ───────────── 8. 보관함 ───────────── */\nfunction renderDrawer(){\n  const layer = document.getElementById(\"drawer-layer\");\n  if (!state.drawer) { if (layer) layer.remove(); return; }\n  const html = `\u003cdiv class=\"drawer-bg\" data-act=\"drawer-close\">\u003c/div>\u003caside class=\"drawer\" aria-label=\"내 경험 보관함\">\n    \u003cdiv class=\"item-h\">\u003ch3>내 경험 보관함\u003c/h3>\u003cbutton class=\"btn sm quiet\" type=\"button\" data-act=\"drawer-close\">닫기\u003c/button>\u003c/div>\n    ${state.archive.length ? state.archive.map(x => `\u003cdiv class=\"item\">\n      \u003cdiv class=\"item-h\">\u003cbutton class=\"open\" type=\"button\" data-open=\"${esc(x.id)}\">${esc(x.input.name || \"이름 없는 경험\")}\u003c/button>\n        ${state.confirmDelete === x.id ? `\u003cspan style=\"display:flex;gap:4px\">\u003cbutton class=\"btn sm\" type=\"button\" data-del-yes=\"${esc(x.id)}\">삭제\u003c/button>\u003cbutton class=\"btn sm quiet\" type=\"button\" data-act=\"del-no\">취소\u003c/button>\u003c/span>`\n          : `\u003cbutton class=\"btn sm quiet\" type=\"button\" data-del=\"${esc(x.id)}\" aria-label=\"삭제\">삭제\u003c/button>`}\u003c/div>\n      \u003cdiv class=\"tags\">${x.order.map(j => `\u003cspan class=\"tag ${x.results[j] && x.results[j].copiedAt ? \"cp\" : \"\"}\">${esc(j)}${x.results[j] && x.results[j].copiedAt ? \" ✓\" : \"\"}\u003c/span>`).join(\"\")}\u003c/div>\n      \u003cdiv class=\"meta\">${new Date(x.updatedAt).toLocaleDateString(\"ko-KR\", {month:\"numeric\", day:\"numeric\"})} 수정${state.confirmDelete === x.id ? \" · 지우면 되돌릴 수 없어요\" : \"\"}\u003c/div>\u003c/div>`).join(\"\")\n      : `\u003cdiv class=\"empty\">아직 저장된 경험이 없어요.\u003cbr>결과를 만들면 여기에 자동으로 모여요.\u003c/div>`}\n    \u003cp class=\"privacy\">✓ 표시는 복사한 직무예요. 보관함은 이 브라우저에만 있어요.\u003c/p>\u003c/aside>`;\n  let el = layer;\n  if (!el) { el = document.createElement(\"div\"); el.id = \"drawer-layer\"; document.body.appendChild(el); el.addEventListener(\"click\", onClick); }\n  el.innerHTML = html;\n}\nfunction updateCount(){ document.getElementById(\"archive-count\").textContent = state.archive.length; }\n\nfunction openExperience(id){\n  state.currentId = id; state.view = \"result\"; state.drawer = false; state.addOpen = false; state.mTab = 0; state.editing = {};\n  if (id !== \"demo\") { store.set(\"current\", id); }\n  render(); window.scrollTo({top:0});\n}\nfunction openDemo(){\n  const facts = verifyFacts(EXAMPLE_RESULT.facts, sourceText(EXAMPLE));\n  const order = [\"마케팅\",\"서비스기획·PM\",\"영업관리\",EXAMPLE_POSTING.label];\n  const results = normalizeResult(EXAMPLE_RESULT, order);\n  const demo = {id:\"demo\", input:{...EXAMPLE, limit:80}, facts, results, order, targets:{[EXAMPLE_POSTING.label]:EXAMPLE_POSTING}, updatedAt:Date.now()};\n  state.archive = state.archive.filter(x => x.id !== \"demo\");\n  state._demo = demo;\n  state.currentId = \"demo\"; state.view = \"result\"; state.editing = {}; state.mTab = 0;\n  render();\n}\nfunction findExp(id){ return id === \"demo\" ? state._demo : state.archive.find(x => x.id === id); }\n\n/* ───────────── 9. 이벤트 ───────────── */\nlet toastTimer;\nfunction toast(msg){\n  clearTimeout(toastTimer);\n  let t = document.querySelector(\".toast\"); if (!t) { t = document.createElement(\"div\"); t.className = \"toast\"; t.setAttribute(\"role\", \"status\"); document.body.appendChild(t); }\n  t.textContent = msg; toastTimer = setTimeout(() => t.remove(), 2200);\n}\nasync function copyText(text){\n  try { await navigator.clipboard.writeText(text); return true; }\n  catch (e) {\n    const ta = document.createElement(\"textarea\"); ta.value = text; ta.style.position = \"fixed\"; ta.style.opacity = \"0\"; document.body.appendChild(ta); ta.select();\n    let ok = false; try { ok = document.execCommand(\"copy\"); } catch (_) {} ta.remove(); return ok;\n  }\n}\nfunction lightUpdateInput(){\n  const suf = sufficiency(state.draft), cg = canGenerate();\n  const g = app.querySelector(\".gauge\"); if (g) g.className = \"gauge l\" + suf.level;\n  const m = document.getElementById(\"suf-msg\"); if (m) m.textContent = suf.msg;\n  const h = document.getElementById(\"cta-hint\"); if (h) h.textContent = cg.why;\n  const go = document.getElementById(\"go\"); if (go) go.disabled = !cg.ok;\n}\napp.addEventListener(\"input\", e => {\n  const t = e.target;\n  if (state.view === \"input\") {\n    if (t.dataset.k) { state.draft[t.dataset.k] = t.dataset.k === \"limit\" ? Math.max(30, Math.min(300, parseInt(t.value, 10) || 80)) : t.value; }\n    if (t.dataset.pf && state.pform) { state.pform[t.dataset.pf] = t.value; return; }\n    saveDraft(); lightUpdateInput();\n  } else if (t.dataset.pf && state.rpform) { state.rpform[t.dataset.pf] = t.value;\n  } else if (t.dataset.edit) {\n    const exp = current(), j = t.dataset.edit, r = exp.results[j];\n    r.edited = t.value; saveArchiveIfReal(exp);\n    const card = t.closest(\".card\"), c = checkCard(exp, r);\n    const len = card.querySelector(\".len\"); len.textContent = `${c.len}자 / ${exp.input.limit || 80}자`; len.classList.toggle(\"over\", c.over);\n    let live = card.querySelector(\".live-check\");\n    if (!live) { live = document.createElement(\"div\"); live.className = \"live-check\"; t.after(live); }\n    live.innerHTML = c.warns.length ? `\u003cp class=\"check bad-c\">⚠ ${c.warns.map(w => esc(w.msg)).join(\" · \")}\u003c/p>` : `\u003cp class=\"check ok\">✓ 숫자·역할 표현이 원문과 일치해요\u003c/p>`;\n    const kw = card.querySelector(\".kw\"); if (kw) kw.innerHTML = keywordHTML(r);\n  }\n});\napp.addEventListener(\"change\", e => { if (e.target.id === \"in-custom\" || e.target.dataset.k === \"limit\") render(); });\nfunction postingError(f){\n  if (!f.title || !f.title.trim()) return \"직무명을 써주세요\";\n  if (!f.jd || f.jd.trim().length \u003c 20) return \"공고 내용을 조금 더 붙여넣어 주세요\";\n  return \"\";\n}\nfunction saveArchiveIfReal(exp){ if (exp.id !== \"demo\") { exp.updatedAt = Date.now(); saveArchive(); } }\n\nfunction onClick(e){\n  const t = e.target.closest(\"button, [data-act], [data-open], [data-del], [data-del-yes]\");\n  if (!t) return;\n  const card = t.closest(\".card\"); const job = card && card.dataset.job;\n  const exp = state.view === \"result\" ? current() : null;\n  if (t.dataset.mode) { state.draft.mode = t.dataset.mode; saveDraft(); return render(); }\n  if (t.dataset.job && t.classList.contains(\"chip\")) {\n    const j = t.dataset.job, d = state.draft;\n    if (d.jobs.includes(j)) d.jobs = d.jobs.filter(x => x !== j);\n    else if (selectedJobs().length \u003c 4) d.jobs.push(j); else toast(\"직무는 4개까지 고를 수 있어요\");\n    saveDraft(); return render();\n  }\n  if (t.id === \"go\") return generate();\n  if (t.dataset.mtab) { state.mTab = +t.dataset.mtab; return render(); }\n  if (t.dataset.add) { state.addOpen = false; return regenerate([t.dataset.add]); }\n  if (t.dataset.open) return openExperience(t.dataset.open);\n  if (t.dataset.pedit) { const p = state.draft.postings.find(x => x.id === t.dataset.pedit); state.pform = {...p}; return render(); }\n  if (t.dataset.pdel) { state.draft.postings = state.draft.postings.filter(x => x.id !== t.dataset.pdel); saveDraft(); return render(); }\n  if (t.dataset.del) { state.confirmDelete = t.dataset.del; return renderDrawer(); }\n  if (t.dataset.delYes) {\n    state.archive = state.archive.filter(x => x.id !== t.dataset.delYes); saveArchive();\n    if (state.draft.editingId === t.dataset.delYes) { state.draft.editingId = null; saveDraft(); }\n    if (state.currentId === t.dataset.delYes) { state.view = \"input\"; state.currentId = null; }\n    state.confirmDelete = null; toast(\"삭제했어요\"); return render();\n  }\n  switch (t.dataset.act) {\n    case \"generate\": return generate();\n    case \"demo\": return openDemo();\n    case \"perm-manage\": {\n      if (!permsNS) return toast(\"페이지 위쪽 메뉴의 권한 설정에서 Claude를 켜주세요\");\n      permsNS.manage().then(() => toast(\"설정을 바꿨다면 페이지를 새로고침해주세요\"), () => toast(\"페이지 위쪽 메뉴의 권한 설정에서 Claude를 켜주세요\"));\n      return;\n    }\n    case \"clear\": state.draft = blankDraft(); saveDraft()       <li>처음 한 번 뜨는 <b>Claude 사용 허용</b> 창에서 허용해요</li>
    </ol>
    <div class="row-end"><button class="btn" type="button" data-dup="demo">예시 결과 먼저 볼게요</button><button class="btn primary" type="button" data-dup="close">알겠어요</button></div>
  </div></div>`;
  const close = () => { m.innerHTML = ""; document.removeEventListener("keydown", onKey); };
  const onKey = e => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  m.querySelector('[data-dup="close"]').onclick = close;
  m.querySelector('[data-dup="demo"]').onclick = () => { close(); openDemo(); };
  m.querySelector('[data-dup="close"]').focus();
}
async function doRename(){
  const name = (document.getElementById("rename-input").value || "").trim();
  if (!name) return toast("괄호에 넣을 이름을 써주세요");
  renameState = "busy"; renderTopNote();
  try {
    await artNS.publish(buildRenamed(name)); // 성공하면 페이지가 새 버전으로 다시 열림
    toast("이름을 붙였어요");
  } catch (e) {
    renameState = "idle";
    const c = e && e.code;
    if (c === "conflict") return; // 이미 새 버전으로 다시 열리는 중
    if (c === "not_writer" || c === "not_granted" || c === "consent_required" || c === "capability_disabled") { artNS = null; renderTopNote(); return toast("이 페이지는 이름을 바꿀 수 없어요. 제목 옆 메뉴에서 직접 바꿔주세요"); }
    renderTopNote(); toast("이름을 바꾸지 못했어요. 잠시 뒤 다시 눌러주세요");
  }
}
document.getElementById("topnote").addEventListener("click", e => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  if (t.dataset.act === "rename") return doRename();
  if (t.dataset.act === "rename-skip") { renameState = "dismissed"; store.set("renameDismissed", true); return renderTopNote(); }
  if (t.dataset.act === "demo") return openDemo();
  if (t.dataset.act === "dup-help") return showDupModal();
});

updateCount();
render();
renderTopNote();
initCopyFeatures();
</script>
