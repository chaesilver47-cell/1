<title>원소스 OneSource</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 입력은 한 칼럼 원고지, 결과는 '원문(형광펜) | 직무별 카드 2열' 작업대 */
:root{
  --bg:#f7f8fa; --surface:#ffffff; --ink:#1c2228; --sub:#5d6873; --faint:#8a949e;
  --line:#e2e6ea; --line-strong:#c9d0d6;
  --accent:#2f54c8; --accent-soft:#e9eefc; --on-accent:#ffffff;
  --hl:#fff0a3; --hl-strong:#ffd84d;
  --warn:#c4420c; --warn-soft:#fdf0e9; --ok:#2a7a3b; --ok-soft:#eaf5ec;
  --shadow:0 1px 2px rgba(20,30,40,.06),0 4px 16px rgba(20,30,40,.05);
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171b; --surface:#1d2126; --ink:#e7eaee; --sub:#a3adb7; --faint:#7c8691;
    --line:#2d333a; --line-strong:#414952;
    --accent:#7d9bf5; --accent-soft:#232c45; --on-accent:#0f1420;
    --hl:#5b4d12; --hl-strong:#806a10;
    --warn:#ff8a5b; --warn-soft:#3a2219; --ok:#6fcf86; --ok-soft:#1b2e21;
    --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14171b; --surface:#1d2126; --ink:#e7eaee; --sub:#a3adb7; --faint:#7c8691;
  --line:#2d333a; --line-strong:#414952;
  --accent:#7d9bf5; --accent-soft:#232c45; --on-accent:#0f1420;
  --hl:#5b4d12; --hl-strong:#806a10;
  --warn:#ff8a5b; --warn-soft:#3a2219; --ok:#6fcf86; --ok-soft:#1b2e21;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:1180px;margin:0 auto}
.narrow{max-width:760px;margin:0 auto}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand b{font-size:20px;font-weight:700;letter-spacing:-.01em}
.brand span{color:var(--sub);font-size:14px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:14px;line-height:1.3;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.primary:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn.quiet{border-color:transparent;background:transparent;color:var(--sub)}
.btn.quiet:hover{color:var(--ink);border-color:var(--line)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.lg{padding:11px 20px;font-size:15px}
.count{font-family:var(--f-mono);font-size:12px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:0 7px}

/* input screen */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:16px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sec-h h2{margin:0;font-size:16px;font-weight:600}
.sec-h h2 small{font-weight:400;color:var(--sub);font-size:13px;margin-left:6px}
.seg-toggle{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.seg-toggle button{border:0;background:transparent;padding:5px 11px;font-size:13px;color:var(--sub)}
.seg-toggle button.on{background:var(--ink);color:var(--surface)}
.grid3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
@media (max-width:620px){.grid3{grid-template-columns:1fr 1fr}.grid3 .f-name{grid-column:1/-1}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;color:var(--sub);font-weight:500}
.field label em{font-style:normal;color:var(--warn)}
.field label small{font-weight:400;color:var(--faint)}
.field input,.field textarea{width:100%;border:1px solid var(--line-strong);border-radius:8px;padding:9px 11px;background:var(--surface);font-size:15px;resize:vertical}
.field input::placeholder,.field textarea::placeholder{color:var(--faint)}
.field input:focus,.field textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
details.more{border-top:1px dashed var(--line);padding-top:10px}
details.more summary{cursor:pointer;color:var(--sub);font-size:14px;list-style:none}
details.more summary::before{content:"＋ "}
details.more[open] summary::before{content:"－ "}
details.more>div{margin-top:10px;display:flex;flex-direction:column;gap:10px}
.gauge-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--sub)}
.gauge{display:flex;gap:3px}
.gauge i{width:34px;height:7px;border-radius:2px;background:var(--line)}
.gauge.l1 i:nth-child(1){background:var(--warn)}
.gauge.l2 i:nth-child(-n+2){background:var(--hl-strong)}
.gauge.l3 i{background:var(--ok)}
.privacy{font-size:13px;color:var(--faint)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:8px 12px;min-width:150px;flex:1 1 150px;max-width:220px}
.chip b{font-size:14px;font-weight:600}
.chip small{font-size:12px;color:var(--sub);line-height:1.4}
.chip.on{border-color:var(--accent);background:var(--accent-soft)}
.chip.on b::before{content:"✓ ";color:var(--accent)}
.chip.add{border-style:dashed}
.custom-row{display:flex;gap:8px;margin-top:8px}
.custom-row input{flex:1;min-width:0;border:1px solid var(--line-strong);border-radius:8px;padding:7px 10px;background:var(--surface)}
.cta-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.cta-row .hint{font-size:14px;color:var(--sub)}
.notice{border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r);padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.notice.warn{border-color:var(--warn);background:var(--warn-soft)}
.notice.info{border-color:var(--accent);background:var(--accent-soft)}

/* loading overlay */
.overlay{position:fixed;inset:0;background:rgba(20,25,30,.42);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.overlay .box{background:var(--surface);border-radius:12px;padding:22px;width:min(400px,100%);box-shadow:0 10px 40px rgba(0,0,0,.25)}
.overlay h3{margin:0 0 10px;font-size:16px}
.steps{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-direction:column;gap:6px}
.steps li{font-size:14px;color:var(--faint);display:flex;gap:8px;align-items:center}
.steps li::before{content:"";width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line-strong);flex:none}
.steps li.done{color:var(--ink)}
.steps li.done::before{background:var(--ok);border-color:var(--ok)}
.steps li.now{color:var(--ink);font-weight:600}
.steps li.now::before{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.steps li.now::before{animation:none;background:var(--accent)}}

/* result workbench */
.rbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-block:4px 14px}
.rbar .left{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.rbar h1{margin:0;font-size:18px;font-weight:700;text-wrap:balance}
.rbar .right{display:flex;gap:6px;flex-wrap:wrap}
.work{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.work{grid-template-columns:1fr}}
.src{position:sticky;top:max(12px,env(safe-area-inset-top,0px));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;max-height:calc(100vh - 24px);overflow:auto}
@media (max-width:860px){.src{position:static;max-height:none}}
.src h3{margin:0 0 2px;font-size:14px}
.src .sub{font-size:12px;color:var(--faint);margin:0 0 10px}
.fact{display:flex;gap:8px;padding:5px 7px;border-radius:5px;font-size:14px;line-height:1.45;transition:background .12s}
.fact .fid{font-family:var(--f-mono);font-size:11px;color:var(--faint);padding-top:2px;flex:none;width:30px;white-space:nowrap}
.fact.lit{background:var(--hl)}
.fact.strong{background:var(--hl-strong);font-weight:600}
.fact.unv{color:var(--warn)}
.fact.unv .fid::after{content:" ?"}
.src details{margin-top:10px;font-size:13px;color:var(--sub)}
.src details pre{white-space:pre-wrap;font:13px/1.5 var(--f-body);color:var(--ink);background:var(--bg);border-radius:6px;padding:8px;margin:6px 0 0}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
.cards.one{grid-template-columns:minmax(0,1fr)}
@media (max-width:1040px){.cards{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:var(--shadow)}
.card:hover{border-color:var(--line-strong)}
.card.has-warn{border-color:var(--warn)}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card-h h4{margin:0;font-size:14px;font-weight:600;color:var(--sub)}
.len{font-family:var(--f-mono);font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.len.over{color:var(--warn);font-weight:600}
.sentence{font-size:17px;font-weight:600;line-height:1.55;letter-spacing:-.005em;margin:0;cursor:text;border-radius:6px;padding:2px 4px;margin-inline:-4px}
.sentence:hover{background:var(--bg)}
.sentence .sg{border-radius:3px;transition:background .12s}
.sentence .sg:hover{background:var(--hl-strong)}
.bad{text-decoration:underline wavy var(--warn);text-decoration-thickness:1.5px;text-underline-offset:4px}
.editor{width:100%;border:1.5px solid var(--accent);border-radius:8px;padding:8px 10px;font-size:16px;font-weight:600;line-height:1.55;background:var(--surface);resize:vertical;min-height:84px}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:12px;border:1px solid var(--line-strong);border-radius:999px;padding:1px 8px;color:var(--sub)}
.why{font-size:13px;background:var(--bg);border-radius:8px;padding:7px 10px;color:var(--ink)}
.why b{font-weight:600}
.check{font-size:13px;display:flex;align-items:center;gap:6px}
.check.ok{color:var(--ok)}
.check.bad-c{color:var(--warn);font-weight:600}
.warns{display:flex;flex-direction:column;gap:6px;border:1px solid var(--warn);background:var(--warn-soft);border-radius:8px;padding:9px 11px;font-size:13px}
.warns p{margin:0}
.warns p b{font-weight:600}
.warns .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.card-f{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.card-f .acts{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.copied{font-size:12px;color:var(--ok)}
.card.busy{opacity:.55;pointer-events:none}
.card.busy .sentence::after{content:" · 다시 만드는 중…";font-weight:400;font-size:13px;color:var(--sub)}
.addcard{border:1.5px dashed var(--line-strong);border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:150px;padding:14px;color:var(--sub);background:transparent}
.addcard .chips{justify-content:center}
.addcard .chip{min-width:0;flex:0 1 auto;padding:5px 10px}
.mtabs{display:none}
@media (max-width:640px){
  .mtabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:10px}
  .mtabs button{border:0;background:transparent;padding:8px 10px;font-size:14px;color:var(--sub);border-bottom:2px solid transparent;white-space:nowrap}
  .mtabs button.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
  .cards .card:not(.m-on){display:none}
  .cards .addcard{display:none}
}
.banner{margin-bottom:12px}
.chip.add:disabled{opacity:.45;cursor:not-allowed}
.posts{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.post{display:flex;align-items:center;gap:10px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:7px 8px 7px 12px}
.post-t{display:flex;flex-direction:column;flex:1;min-width:0}
.post-t b{font-size:14px;font-weight:600;overflow-wrap:anywhere}
.post-t small{font-size:12px;color:var(--sub)}
.post-badge{font-size:11px;font-weight:600;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 5px;white-space:nowrap;vertical-align:1px}
.pform{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line-strong);border-radius:10px;padding:12px;margin-top:10px;background:var(--bg);width:100%;text-align:left}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.row-end{display:flex;justify-content:flex-end;gap:6px}
.addcard.open{align-items:stretch;justify-content:flex-start}
.kw{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.kw-l{font-size:12px;color:var(--sub);margin-right:2px}
.kwi{font-size:12px;border:1px dashed var(--line-strong);border-radius:999px;padding:1px 8px;color:var(--faint)}
.kwi.on{border:1px solid var(--accent);color:var(--accent);background:var(--accent-soft)}
.demo-badge{font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 9px}

/* drawer */
.drawer-bg{position:fixed;inset:0;background:rgba(20,25,30,.3);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(360px,92vw);background:var(--surface);border-left:1px solid var(--line);z-index:21;padding:18px;padding-right:max(18px,env(safe-area-inset-right,0px));padding-top:max(18px,env(safe-area-inset-top,0px));overflow:auto;display:flex;flex-direction:column;gap:12px}
.drawer h3{margin:0;font-size:16px}
.item{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.item:hover{border-color:var(--line-strong)}
.item-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.item-h button.open{border:0;background:transparent;padding:0;text-align:left;font-weight:600;font-size:15px}
.item-h button.open:hover{color:var(--accent)}
.item .meta{font-size:12px;color:var(--faint)}
.item .tag.cp{border-color:var(--ok);color:var(--ok)}
.empty{color:var(--sub);font-size:14px;border:1px dashed var(--line-strong);border-radius:var(--r);padding:16px;text-align:center}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:999px;font-size:14px;z-index:40}
.foot{margin-top:28px;font-size:12px;color:var(--faint);text-align:center}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><b>원소스</b><span>경험 1개 → 직무별 이력서 1~2줄</span></div>
    <button class="btn" id="open-archive" type="button">보관함 <span class="count" id="archive-count">0</span></button>
  </header>
  <main id="app"></main>
  <p class="foot">입력한 경험과 결과는 이 브라우저에만 저장돼요 · 문장은 AI가 쓴 초안이에요. 원문과 대조한 뒤 쓰세요.</p>
</div>
<div id="layer"></div>

  tools:"인스타그램, 캔바", problem:"", raw:""
};

function sourceText(d){
  if (d.mode === "raw") return `활동명: ${d.name || "(없음)"}\n내 역할: ${d.role || "(없음)"}\n기간: ${d.period || "(없음)"}\n내용:\n${d.raw}`;
  const out = [];
  FIELDS.forEach(f => { const v = (d[f.k] || "").trim(); if (v) out.push(f.multi ? `${f.label}:\n${v}` : `${f.label}: ${v}`); });
  return out.join("\n");
}
function targetBlock(targets){
  return targets.map((t, i) => {
    if (t.kind === "posting") return `${i+1}. ${t.label}  ← 채용공고 맞춤
   - 직무: ${t.title}
   - 채용공고 원문:
"""
${(t.jd || "").trim().slice(0, 3000)}
"""
   - 이 공고가 원하는 역량 키워드를 3~5개, 공고에 쓰인 표현 그대로 뽑아 keywords에 넣어.
   - 그중 원문 사실로 뒷받침되는 키워드를 골라, 문장에는 공고의 표현(용어)을 그대로 써서 반영해.
   - 공고에 있다고 해서 원문에 없는 경험·역량·숫자를 만들어 넣지 마. 근거 없는 키워드는 문장에서 빼.
   - reason은 "이 공고는 ~를 원해서 ~를 앞에 뒀어요" 형식으로.`;
    const info = JOBS[t.label];
    return info ? `${i+1}. ${t.label}\n   - 이 직무가 보는 것: ${info.desc.replace("를 봐요","")}\n   - 앞세울 사실: ${info.focus}\n   - 자주 쓰는 용어: ${info.terms}`
                : `${i+1}. ${t.label}\n   - 이 직무가 중요하게 보는 역량을 네가 판단해서 그에 맞는 사실을 앞세워.`;
  }).join("\n");
}

async function askJSON(prompt, onText, signal){
  await samplePromise;
  if (!sampleFn) throw {code:"unavailable"};
  try {
    return await sampleFn.json(prompt, {onText, signal, cache:false});
  } catch (e) {
    if (e && e.code === "invalid_json") return await sampleFn.json(prompt, {onText, signal, cache:false}); // 형식 오류만 1회 재요청
    throw e;
  }
}

/* ───────────── 3. 규칙 검사 (AI가 아니라 코드가 함) ───────────── */
const squash = s => (s || "").replace(/[\s·.,:;'"“”‘’()\[\]\-~/!?]/g, "").toLowerCase();
const NATIVE = {한:1,두:2,세:3,네:4,다섯:5,여섯:6,일곱:7,여덟:8,아홉:9,열:10,스무:20,스물:20};
const SINO = {일:1,이:2,삼:3,사:4,오:5,육:6,칠:7,팔:8,구:9,십:10};
function numbers(text){
  const found = [];
  const t = text || "";
  t.replace(/(\d+(?:[.,]\d+)*)(\s?(?:%|퍼센트|만\s?원|원|곳|명|건|개월|개|주|회|번|위|배|시간|년|일|팀|가지))?/g, (m, n) => { found.push({raw:m.trim(), v:n.replace(/,/g, "").replace(/^0+(?=\d)/, "")}); return m; });
  t.replace(/(한|두|세|네|다섯|여섯|일곱|여덟|아홉|열|스무|스물)\s?(곳|명|건|개|주|회|번|차례|가지|달|팀|시간|군데)/g, (m, n) => { found.push({raw:m, v:String(NATIVE[n])}); return m; });
  t.replace(/(일|이|삼|사|오|육|칠|팔|구|십)\s?(개월|주간|위)/g, (m, n) => { found.push({raw:m, v:String(SINO[n])}); return m; });
  return found;
}
const ROLE_WORDS = ["주도","총괄","리드","이끌","지휘","전담","단독","책임지","진두"];
const LEAD_OK = ["주도","리드","이끌"];
const LEADER_RE = /팀장|리더|대표|회장|단장|조장|부장|기장|반장|PM/;

function checkCard(exp, r){
  const text = cardText(r);
  const src = sourceText(exp.input);
  const srcNums = new Set(numbers(src).map(n => n.v));
  const warns = [];
  const seen = new Set();
  numbers(text).forEach(n => {
    if (!srcNums.has(n.v) && !seen.has(n.raw)) { seen.add(n.raw); warns.push({type:"num", hit:n.raw, msg:`원문에 없는 숫자 '${n.raw}'`, help:`원문에서 '${n.v}'을(를) 찾지 못했어요. 직접 쓴 숫자가 아니라면 고쳐주세요.`}); }
  });
  ROLE_WORDS.forEach(w => {
    if (text.includes(w) && !src.includes(w)) {
      if (LEAD_OK.includes(w) && LEADER_RE.test(src)) return;
      const m = text.match(new RegExp(w + "[가-힣]{0,2}"));
      warns.push({type:"role", hit:m ? m[0] : w, msg:`원문보다 강한 역할 표현 '${m ? m[0] : w}'`, help:"원문에 이런 역할 표현이 없어요. 실제 역할보다 부풀려지지 않았는지 확인해주세요."});
    }
  });
  if (!r.edited) {
    const used = new Set((r.segments || []).flatMap(s => s.facts || []));
    exp.facts.filter(f => used.has(f.id) && !f.ok).forEach(f => {
      warns.push({type:"src", hit:null, fid:f.id, msg:`원문에서 못 찾은 내용 '${f.quote}'`, help:"AI가 근거로 댄 문구가 원문에 그대로 없어요. 사실인지 확인해주세요."});
    });
  }
  const len = [...text].length;
  return {warns, len, over: len > (exp.input.limit || 80)};
}
function bigrams(s){ const t = squash(s); const set = new Set(); for (let i = 0; i < t.length - 1; i++) set.add(t.slice(i, i + 2)); return set; }
function similarity(a, b){ const A = bigrams(a), B = bigrams(b); if (!A.size || !B.size) return 0; let n = 0; A.forEach(x => B.has(x) && n++); return n / (A.size + B.size - n); }
function tooSimilar(exp){
  const t = exp.order.map(j => cardText(exp.results[j])).filter(Boolean);
  if (t.length < 2) return false;
  let sum = 0, c = 0;
  for (let i = 0; i < t.length; i++) for (let k = i + 1; k < t.length; k++) { sum += similarity(t[i], t[k]); c++; }
  return sum / c > 0.5;
}

/* ───────────── 4. 결과 정리 ───────────── */
const cardText = r => !r ? "" : (r.edited != null ? r.edited : (r.segments || []).map(s => s.text).join("")).trim();
function normalizeResult(raw, jobs){
  const out = {};
  (raw && Array.isArray(raw.results) ? raw.results : []).forEach(r => {
    if (!r || !Array.isArray(r.segments)) return;
    let job = String(r.job || "");
    if (!jobs.includes(job)) job = jobs.find(j => squash(j) === squash(job) || job.includes(j) || j.includes(job)) || job;
    if (!jobs.includes(job)) return;
    out[job] = {
      segments: r.segments.filter(s => s && s.text).map(s => ({text:String(s.text), facts:Array.isArray(s.facts) ? s.facts.map(String) : []})),
      reason: String(r.reason || ""), tags: Array.isArray(r.tags) ? r.tags.slice(0, 3).map(String) : [],
      keywords: Array.isArray(r.keywords) ? r.keywords.map(k => typeof k === "string" ? k : (k && (k.word || k.keyword)) || "").map(k => String(k).trim()).filter(Boolean).slice(0, 5) : [],
      edited: null, copiedAt: null
    };
  });
  return out;
}
function verifyFacts(facts, src){
  const s = squash(src);
  return (Array.isArray(facts) ? facts : []).filter(f => f && f.id && f.quote).map(f => ({id:String(f.id), quote:String(f.quote), ok: s.includes(squash(f.quote))}));
}

async function generate(){
  const d = state.draft;
  const targets = selectedTargets();
  const jobs = targets.map(t => t.label);
  state.error = null;
  ctl = new AbortController();
  let step = 0; showLoading(0);
  const onText = ({text}) => {
    let s = 1, extra = "";
    if (text.includes('"results"')) { s = 2; const n = (text.split('"results"')[1].match(/"job"/g) || []).length; extra = `${Math.max(1, n)}/${jobs.length}`; }
    if (s !== step || s === 2) { step = s; showLoading(s, extra); }
  };
  try {
    const raw = await askJSON(generatePrompt(d, targets), onText, ctl.signal);
    showLoading(3);
    const src = sourceText(d);
    const facts = verifyFacts(raw && raw.facts, src);
    const results = normalizeResult(raw, jobs);
    const order = jobs.filter(j => results[j]);
    if (!order.length) throw {code:"invalid_json"};
    const now = Date.now();
    const input = JSON.parse(JSON.stringify({mode:d.mode,name:d.name,role:d.role,period:d.period,did:d.did,result:d.result,tools:d.tools,problem:d.problem,raw:d.raw,limit:d.limit}));
    const tmap = Object.fromEntries(targets.map(t => [t.label, t]));
    let exp = d.editingId && state.archive.find(x => x.id === d.editingId);
    if (exp) Object.assign(exp, {input, facts, results, order, targets:tmap, updatedAt:now});
    else { exp = {id:"e" + now, createdAt:now, updatedAt:now, input, facts, results, order, targets:tmap}; state.archive.unshift(exp); }
    state.archive = state.archive.slice(0, 40);
    saveArchive();
    state.draft.editingId = exp.id; state.draft.isExample = false; saveDraft();
    await new Promise(r => setTimeout(r, 350));
    openExperience(exp.id);
  } catch (e) {
    if (!(e && e.code === "cancelled")) state.error = errMsg(e);
    render();
  } finally { hideLayer(); ctl = null; }
}

async function regenerate(jobs, avoidMap){
  const exp = current(); if (!exp) return;
  jobs.forEach(j => state.editing[j] = false);
  const busy = new Set(jobs);
  render(busy);
  const avoid = jobs.flatMap(j => (avoidMap && avoidMap[j]) || []);
  try {
    const raw = await askJSON(regenPrompt(exp, jobs, avoid), null, new AbortController().signal);
    const res = normalizeResult(raw, jobs);
    let got = 0;
    jobs.forEach(j => { if (res[j]) { exp.results[j] = res[j]; got++; if (!exp.order.includes(j)) exp.order.push(j); } });
    if (!got) throw {code:"invalid_json"};
    exp.updatedAt = Date.now(); saveArchive();
    toast(jobs.length === 1 ? `${jobs[0]} 문장을 새로 만들었어요` : "새 직무 문장을 만들었어요");
  } catch (e) {
    if (!(e && e.code === "cancelled")) toast(errMsg(e));
  }
  render();
}

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const app = document.getElementById("app");
const postingLabel = p => ((p.company || "").trim() ? p.company.trim() + " · " : "") + (p.title || "").trim();
function selectedTargets(){
  const d = state.draft, list = [];

  const c = (d.custom || "").trim();
  if (c && !list.some(t => t.label === c)) list.push({label:c, kind:"job"});
  (d.postings || []).forEach(p => {
    let l = postingLabel(p); while (list.some(t => t.label === l)) l += " ②";
    list.push({label:l, kind:"posting", company:(p.company || "").trim(), title:(p.title || "").trim(), jd:p.jd || ""});
  });
  return list.slice(0, 4);
}
const selectedJobs = () => selectedTargets().map(t => t.label);
function keywordHits(r){
  const sq = squash(cardText(r));
  return (r.keywords || []).map(k => {
    const words = k.replace(/\s*(역량|능력|경험|스킬)$/, "").split(/\s+/).map(w => squash(w).replace(/(을|를|이|가|의|및|과|와)$/, "")).filter(w => w.length >= 2);
    return {k, used: words.length > 0 && words.every(w => sq.includes(w))};
  });
}
function keywordHTML(r){
  const hits = keywordHits(r);
  if (!hits.length) return "";
  const n = hits.filter(h => h.used).length;
  return `<span class="kw-l">공고 키워드 ${n}/${hits.length}</span>${hits.map(h => `<span class="kwi ${h.used ? "on" : ""}" title="${h.used ? "문장에 반영됨" : "문장에 안 들어감 (경험 근거가 약하거나 우선순위에서 밀림)"}">${h.used ? "✓ " : ""}${esc(h.k)}</span>`).join("")}`;
}

function sufficiency(d){
  const body = d.mode === "raw" ? d.raw : [d.did, d.result, d.problem].join("\n");
  const facts = body.split(/\n|,|·(?=\s)|\.(?=\s|$)|;/).map(s => s.trim()).filter(s => s.length >= 3).length;
  const nums = numbers(body).length;
  const level = facts >= 5 && nums >= 1 ? 3 : facts >= 3 ? 2 : 1;
  const msg = level === 3 ? `사실 ${facts}개 · 숫자 ${nums}개 · 직무별로 다르게 쓰기 충분해요`
    : level === 2 ? `사실 ${facts}개${nums ? "" : " · 숫자 없음"} · 성과나 숫자를 하나 더 넣으면 직무별 차이가 커져요`
    : `사실 ${facts}개 · 이대로면 직무별 문장이 비슷하게 나올 수 있어요`;
  return {level, msg, facts};
}
function canGenerate(){
  const d = state.draft;
  const filled = d.mode === "raw" ? (d.raw.trim().length >= 10 && d.name.trim()) : (d.name.trim() && d.role.trim() && d.did.trim());
  const n = selectedJobs().length;
  return {ok: !!filled && n >= 2, why: !filled ? (d.mode === "raw" ? "활동명과 내용을 채워주세요" : "활동명, 내 역할, 한 일을 채워주세요") : n < 2 ? "직무나 채용공고를 2개 이상 골라주세요" : `지원 대상 ${n}개로 만들어요`};
}

function renderSentence(r, warns){
  const hits = warns.map(w => w.hit).filter(Boolean);
  const mark = t => { let h = esc(t); hits.forEach(x => { const ex = esc(x); h = h.split(ex).join(`<span class="bad">${ex}</span>`); }); return h; };
  if (r.edited != null) return mark(r.edited);
  return (r.segments || []).map(s => `<span class="sg" data-f="${esc((s.facts || []).join(" "))}">${mark(s.text)}</span>`).join("");
}

/* ───────────── 7. 근거 하이라이트 ───────────── */
function bindHighlight(){
  const facts = [...app.querySelectorAll(".fact")];
  const lit = (ids, strong) => facts.forEach(f => {
    f.classList.toggle("lit", ids.includes(f.dataset.fid));
    f.classList.toggle("strong", strong.includes(f.dataset.fid));
  });
  app.querySelectorAll(".card").forEach(c => {
    const ids = (c.dataset.facts || "").split(" ").filter(Boolean);
    c.addEventListener("mouseenter", () => lit(ids, []));
    c.addEventListener("mouseleave", () => lit([], []));
    c.addEventListener("focusin", () => lit(ids, []));
    c.querySelectorAll(".sg").forEach(s => {
      const own = (s.dataset.f || "").split(" ").filter(Boolean);
      s.addEventListener("mouseenter", () => lit(ids, own));
      s.addEventListener("mouseleave", () => lit(ids, []));
    });
  });
}

      <div class="meta">${new Date(x.updatedAt).toLocaleDateString("ko-KR", {month:"numeric", day:"numeric"})} 수정${state.confirmDelete === x.id ? " · 지우면 되돌릴 수 없어요" : ""}</div></div>`).join("")
      : `<div class="empty">아직 저장된 경험이 없어요.<br>결과를 만들면 여기에 자동으로 모여요.</div>`}
    <p class="privacy">✓ 표시는 복사한 직무예요. 보관함은 이 브라우저에만 있어요.</p></aside>`;
  let el = layer;
  if (!el) { el = document.createElement("div"); el.id = "drawer-layer"; document.body.appendChild(el); el.addEventListener("click", onClick); }
  el.innerHTML = html;
}
function updateCount(){ document.getElementById("archive-count").textContent = state.archive.length; }

function openExperience(id){
  state.currentId = id; state.view = "result"; state.drawer = false; state.addOpen = false; state.mTab = 0; state.editing = {};
  if (id !== "demo") { store.set("current", id); }
  render(); window.scrollTo({top:0});
}
function openDemo(){
  const facts = verifyFacts(EXAMPLE_RESULT.facts, sourceText(EXAMPLE));
  const results = normalizeResult(EXAMPLE_RESULT, ["마케팅","서비스기획·PM","영업관리"]);
  const demo = {id:"demo", input:{...EXAMPLE, jd:{}, limit:80}, facts, results, order:["마케팅","서비스기획·PM","영업관리"], updatedAt:Date.now()};
  state.archive = state.archive.filter(x => x.id !== "demo");
  state._demo = demo;
  state.currentId = "demo"; state.view = "result"; state.editing = {}; state.mTab = 0;
  render();
}
function findExp(id){ return id === "demo" ? state._demo : state.archive.find(x => x.id === id); }

/* ───────────── 9. 이벤트 ───────────── */
let toastTimer;
function toast(msg){
  clearTimeout(toastTimer);
  let t = document.querySelector(".toast"); if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = msg; toastTimer = setTimeout(() => t.remove(), 2200);
}
async function copyText(text){
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (_) {} ta.remove(); return ok;
  }
}
function lightUpdateInput(){
  const suf = sufficiency(state.draft), cg = canGenerate();
  const g = app.querySelector(".gauge"); if (g) g.className = "gauge l" + suf.level;
  const m = document.getElementById("suf-msg"); if (m) m.textContent = suf.msg;
  const h = document.getElementById("cta-hint"); if (h) h.textContent = cg.why;
  const go = document.getElementById("go"); if (go) go.disabled = !cg.ok;
}
app.addEventListener("input", e => {
  const t = e.target;
  if (state.view === "input") {
    if (t.dataset.k) { state.draft[t.dataset.k] = t.dataset.k === "limit" ? Math.max(30, Math.min(300, parseInt(t.value, 10) || 80)) : t.value; }
    if (t.dataset.pf && state.pform) { state.pform[t.dataset.pf] = t.value; return; }
    saveDraft(); lightUpdateInput();
  } else if (t.dataset.pf && state.rpform) { state.rpform[t.dataset.pf] = t.value;
  } else if (t.dataset.edit) {
    const exp = current(), j = t.dataset.edit, r = exp.results[j];
    r.edited = t.value; saveArchiveIfReal(exp);
    const card = t.closest(".card"), c = checkCard(exp, r);
    const len = card.querySelector(".len"); len.textContent = `${c.len}자 / ${exp.input.limit || 80}자`; len.classList.toggle("over", c.over);
    let live = card.querySelector(".live-check");
    if (!live) { live = document.createElement("div"); live.className = "live-check"; t.after(live); }
    live.innerHTML = c.warns.length ? `<p class="check bad-c">⚠ ${c.warns.map(w => esc(w.msg)).join(" · ")}</p>` : `<p class="check ok">✓ 숫자·역할 표현이 원문과 일치해요</p>`;
    const kw = card.querySelector(".kw"); if (kw) kw.innerHTML = keywordHTML(r);
  }
});
app.addEventListener("change", e => { if (e.target.id === "in-custom" || e.target.dataset.k === "limit") render(); });
function postingError(f){
  if (!f.title || !f.title.trim()) return "직무명을 써주세요";
  if (!f.jd || f.jd.trim().length < 20) return "공고 내용을 조금 더 붙여넣어 주세요";
  return "";
}
function saveArchiveIfReal(exp){ if (exp.id !== "demo") { exp.updatedAt = Date.now(); saveArchive(); } }

function onClick(e){
  const t = e.target.closest("button, [data-act], [data-open], [data-del], [data-del-yes]");
  if (!t) return;
  const card = t.closest(".card"); const job = card && card.dataset.job;
  const exp = state.view === "result" ? current() : null;
  if (t.dataset.mode) { state.draft.mode = t.dataset.mode; saveDraft(); return render(); }
  if (t.dataset.job && t.classList.contains("chip")) {
    const j = t.dataset.job, d = state.draft;
    if (d.jobs.includes(j)) d.jobs = d.jobs.filter(x => x !== j);
    else if (selectedJobs().length < 4) d.jobs.push(j); else toast("직무는 4개까지 고를 수 있어요");
    saveDraft(); return render();
  }
  if (t.id === "go") return generate();
  if (t.dataset.mtab) { state.mTab = +t.dataset.mtab; return render(); }
  if (t.dataset.add) { state.addOpen = false; return regenerate([t.dataset.add]); }
  if (t.dataset.open) return openExperience(t.dataset.open);
  if (t.dataset.pedit) { const p = state.draft.postings.find(x => x.id === t.dataset.pedit); state.pform = {...p}; return render(); }
  if (t.dataset.pdel) { state.draft.postings = state.draft.postings.filter(x => x.id !== t.dataset.pdel); saveDraft(); return render(); }
  if (t.dataset.del) { state.confirmDelete = t.dataset.del; return renderDrawer(); }
  if (t.dataset.delYes) {
    state.archive = state.archive.filter(x => x.id !== t.dataset.delYes); saveArchive();
    if (state.draft.editingId === t.dataset.delYes) { state.draft.editingId = null; saveDraft(); }
    if (state.currentId === t.dataset.delYes) { state.view = "input"; state.currentId = null; }
    state.confirmDelete = null; toast("삭제했어요"); return render();
  }
  switch (t.dataset.act) {
    case "generate": return generate();
    case "demo": return openDemo();
    case "clear": state.draft = blankDraft(); saveDraft(); return render();
    case "back": {
      if (exp && exp.id !== "demo") { state.draft = Object.assign(blankDraft(), JSON.parse(JSON.stringify(exp.input)), {jobs: exp.order.filter(j => JOBS[j]), custom: exp.order.find(j => !JOBS[j] && targetOf(exp, j).kind !== "posting") || "",
        postings: exp.order.filter(j => targetOf(exp, j).kind === "posting").map((j, i) => { const t = targetOf(exp, j); return {id:"p" + Date.now() + i, company:t.company, title:t.title, jd:t.jd}; }), editingId: exp.id}); saveDraft(); }
      state.pform = null;
      state.view = "input"; state.error = null; return render();
    }
    case "new": state.draft = blankDraft(); saveDraft(); state.view = "input"; state.currentId = null; state.error = null; render(); window.scrollTo({top:0}); return toast(exp && exp.id !== "demo" ? "지금 경험은 보관함에 저장돼 있어요" : "새 경험을 넣어주세요");
    case "drawer-close": state.drawer = false; state.confirmDelete = null; return renderDrawer();
    case "del-no": state.confirmDelete = null; return renderDrawer();
    case "add-open": state.addOpen = true; return render();
    case "add-close": state.addOpen = false; return render();
    case "pf-new": state.pform = {id:null, company:"", title:"", jd:""}; render(); { const el = document.getElementById("pf-company"); el && el.focus(); } return;
    case "pf-cancel": state.pform = null; return render();
    case "pf-save": {
      const f = state.pform, err = postingError(f); if (err) return toast(err);
      const d = state.draft; d.postings = d.postings || [];
      if (f.id) d.postings = d.postings.map(p => p.id === f.id ? {...f} : p);
      else { if (selectedTargets().length >= 4) return toast("지원 대상은 4개까지예요"); d.postings.push({...f, id:"p" + Date.now()}); }
      state.pform = null; saveDraft(); render(); return toast("공고를 지원 대상에 넣었어요");
    }
    case "rpf-new": state.rpform = {id:null, company:"", title:"", jd:""}; render(); { const el = document.getElementById("rpf-company"); el && el.focus(); } return;
    case "rpf-cancel": state.rpform = null; state.addOpen = false; return render();
    case "rpf-save": {
      const f = state.rpform, err = postingError(f); if (err) return toast(err);
      let l = postingLabel(f); while (exp.order.includes(l)) l += " ②";
      exp.targets = exp.targets || {};
      exp.targets[l] = {label:l, kind:"posting", company:(f.company || "").trim(), title:f.title.trim(), jd:f.jd};
      state.rpform = null; state.addOpen = false;
      return regenerate([l]);
    }
    case "add-custom": { const v = (document.getElementById("add-custom").value || "").trim(); if (!v) return; if (exp.order.includes(v)) return toast("이미 있는 직무예요"); state.addOpen = false; return regenerate([v]); }
    case "edit": if (job && !state.editing[job]) { state.editing[job] = true; render(); } return;
    case "done": state.editing[job] = false; { const r = exp.results[job]; if (r.edited != null && r.edited.trim() === (r.segments || []).map(s => s.text).join("").trim()) r.edited = null; saveArchiveIfReal(exp); } return render();
    case "revert": exp.results[job].edited = null; state.editing[job] = false; saveArchiveIfReal(exp); return render();
    case "regen": return regenerate([job]);
    case "regen-fix": { const c = checkCard(exp, exp.results[job]); return regenerate([job], {[job]: c.warns.map(w => w.msg)}); }
    case "copy": {
      const r = exp.results[job];
      const text = state.editing[job] ? (card.querySelector(".editor").value || "") : cardText(r);
      copyText(text).then(ok => {
        if (!ok) return toast("복사가 막혀 있어요. 문장을 눌러 직접 선택해 복사해주세요");
        r.copiedAt = Date.now(); state.editing[job] = false; saveArchiveIfReal(exp); render(); toast(`${job} 문장을 복사했어요`);
      });
      return;
    }
  }
}
app.addEventListener("click", onClick);
document.getElementById("open-archive").addEventListener("click", () => { state.drawer = true; renderDrawer(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && state.drawer) { state.drawer = false; renderDrawer(); } });

// current()는 예시 결과도 찾을 수 있게
function current(){ return findExp(state.currentId); }

updateCount();
render();
</script>
